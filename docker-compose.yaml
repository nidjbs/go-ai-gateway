# Two gateway replicas + a single Redis for shared state + a mock upstream.
# The two gateway containers are intentionally identical except for their
# host port (8080 and 8082) so we can prove that a single `rps: 5` limit is
# enforced across replicas via the shared Redis bucket.

services:
  mock:
    build:
      context: .
      target: mock
    command: ["--listen", "0.0.0.0:19090", "--role", "primary"]

  redis:
    image: redis:7-alpine
    # Ephemeral by default (no persistence): rate-limit buckets and quota
    # counters reset on restart, which is fine for the smoke test. For
    # production with key revocation, switch to AOF persistence so a restart
    # does not silently un-revoke keys:
    #   command: ["redis-server", "--appendonly", "yes"]
    #   volumes: [redis-data:/data]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 5

  gateway-1:
    build:
      context: .
      target: gateway
    command: ["--config", "/etc/go-ai-gateway/config.yaml"]
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      UPSTREAM_API_KEY: primary-token
    volumes:
      - ./configs/config.docker.yaml:/etc/go-ai-gateway/config.yaml:ro
    depends_on:
      mock:
        condition: service_started
      redis:
        condition: service_healthy
    restart: on-failure

  gateway-2:
    build:
      context: .
      target: gateway
    command: ["--config", "/etc/go-ai-gateway/config.yaml"]
    ports:
      - "8082:8080"
      - "8083:8081"
    environment:
      UPSTREAM_API_KEY: primary-token
    volumes:
      - ./configs/config.docker.yaml:/etc/go-ai-gateway/config.yaml:ro
    depends_on:
      mock:
        condition: service_started
      redis:
        condition: service_healthy
    restart: on-failure