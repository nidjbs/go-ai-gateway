listen: 127.0.0.1:8080
healthz: 127.0.0.1:8081
readyz_wait_time: 10s

# Optional: require a bearer token (from this env var) on operational
# endpoints (/metrics, /readyz, /version). Leave unset for no auth.
# ops_token_env: GATEWAY_OPS_TOKEN

auth:
  mode: none
  token_env: GATEWAY_STATIC_TOKEN

# `auth.mode` accepts `none`, `static`, or `api-key`.
# When `auth.mode = api-key`, configure one or more teams below.
# When `auth.mode = static`, set `token_env` to the env var holding the bearer token.
# When `auth.mode = api-key`, `token_env` is ignored.
teams:
  - id: team-demo
    name: Demo Team
    api_keys:
      - id: key-demo
        key: sk-replace-me-with-a-generated-key
        limits:
          rps: 10
          burst: 20
          preday_tokens: 100000          # daily token quota (UTC reset)
          monthly_tokens: 2000000        # monthly token quota (UTC reset)
          alias_preday_tokens:           # per-model daily quotas
            chat: 50000
            embedding: 100000
          # max_requests_per_day: 1000      # hard per-key request counter (charged before execution)
          # max_tokens_per_request: 4096    # clamp max_tokens / max_completion_tokens / max_output_tokens per request

providers:
  local:
    # Supported types: openai and anthropic. The public API remains OpenAI Chat Completions.
    type: openai
    base_url: http://host.docker.internal:19090/v1
    api_key_env: UPSTREAM_API_KEY
    request_timeout: 30s
    # force_usage controls stream_options.include_usage injection on streaming
    # chat requests so the upstream reports token usage (quota/cost data):
    #   unset  -> inject (default; safe for quota accounting)
    #   true   -> always inject
    #   false  -> never inject; trust the upstream's default
    # force_usage: true

aliases:
  chat:
    provider: local
    model: mock-chat
  embedding:
    provider: local
    model: mock-embedding

retry:
  enabled: true
  max_attempts_per_provider: 2
  max_elapsed_time: 30s
  per_attempt_timeout: 10s
  initial_interval: 200ms
  max_interval: 2s
  multiplier: 2
  jitter: 0.2
  retryable_statuses: [408, 429, 500, 502, 503, 504]

failover:
  enabled: true
  max_providers: 0

# Per-(provider, base_url) circuit breaker. When enabled, consecutive upstream
# failures trip the breaker; further requests skip the upstream until the
# open duration elapses, after which a small probe batch is permitted.
circuit_breaker:
  enabled: true
  failure_threshold: 5         # consecutive failures to open
  open_duration: 30s            # how long the breaker stays open
  half_open_max_requests: 1     # probe requests allowed in half-open
  half_open_success_threshold: 1  # consecutive probe successes to close

# In-flight concurrency caps. Both default to 0 (= unlimited). When set, the
# gateway returns 503 + server_overloaded / key_overloaded when the cap is
# reached.
server:
  max_concurrent_requests: 0   # total in-flight requests across all keys
  max_concurrent_per_key: 0    # in-flight requests per API key
  read_timeout: 30s            # http server read timeout (slow-body protection)
  idle_timeout: 90s            # reap idle keep-alive connections
  stream_idle_timeout: 0s      # kill streams silent for this long (0s = off)
  stream_max_duration: 0s      # hard ceiling on total stream lifetime (0s = off)
  idempotency_enabled: false   # replay non-streaming responses for Idempotency-Key retries
  idempotency_ttl: 1h          # replay cache TTL
  access_log:                  # structured per-request access logging (metadata only)
    enabled: false
    sample_ratio: 1.0          # 0.0-1.0 fraction of requests logged
    # exclude_paths: ["/healthz"]  # default excludes probes/metrics

# Admin surface: runtime key revocation + usage queries on the ops port.
# When enabled, GATEWAY_ADMIN_TOKEN must be set or the gateway refuses to
# start. Revocations are permanent by default; use revoke_ttl to bound them.
# admin:
#   enabled: true
#   token_env: GATEWAY_ADMIN_TOKEN
#   revocation:
#     driver: redis               # "memory" (per-replica) or "redis" (shared)
#     options:
#       addr: 127.0.0.1:6379
#   # revoke_ttl: 720h             # 0 = permanent (default; pair with AOF)
#   # cache_ttl: 5s               # replica-local revocation cache TTL

# Output-side DLP: mask or reject PII/sensitive patterns in model responses.
# Patterns: email, phone, credit_card, ip_address, secret_key, ssn, url.
# dlp:
#   enabled: true
#   mode: mask                    # "mask" replaces matches; "reject" fails the request
#   mask_text: "[REDACTED]"
#   patterns: [email, phone, credit_card, ip_address, secret_key, ssn]
#   carry_size: 256               # stream boundary window (bytes)

# OpenTelemetry tracing. When enabled, the gateway emits server spans for
# each inbound request, client spans for each upstream call (with traceparent
# injection), and per-attempt child spans inside retry.Execute.
tracing:
  enabled: false               # default off; turn on with a real collector endpoint
  endpoint: localhost:4318     # OTLP HTTP receiver
  insecure: true               # set false when the collector presents TLS
  sample_ratio: 1.0            # 1.0 = always sample; 0.05 = 5%
  service_name: ai-gateway

# Pluggable storage drivers. Same shape for rate_limit / quota / usage; the
# driver name is matched against the package's driver registry, and options
# are forwarded to the factory. Examples (uncomment to enable):
#
# rate_limit:
#   driver: memory            # default; "memory" / "redis" / ...
#   options: {}
#
# quota:
#   driver: memory            # default
#   options: {}
#
# usage:
#   driver: sqlite            # default is stderr audit ("audit" sink); sqlite persists to disk
#   options:
#     path: ./usage.db
#     max_connections: 1      # SQLite single-writer by default


rate_limit:
   driver: redis
   options:
     addr: 127.0.0.1:6379
     password: ""             # set when ACL is enabled
     db: 0
     dial_timeout: 2s
     read_timeout: 250ms

quota:
   driver: redis
   options:
     addr: 127.0.0.1:6379

guardrails:
   enabled: true
   mode: block
   threshold: 0.75
   # Substrings that bypass scanning when present in message content — an
   # escape hatch for false-positive-prone payloads (benchmark suites, etc.).
   # allowlist:
   #   - BENCHMARK_PAYLOAD
   tracker:
     max_attempts: 3
     window_sec: 60
     penalty_sec: 30
     driver:
       driver: redis
       options:
         addr: 127.0.0.1:6379
